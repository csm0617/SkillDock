# SkillDock bundle layer.
#
# Unlike smoke.yml (a --patch overlay that points at a relative source path),
# this layer is applied when a profile lists `dsh-plugin-changhai-skill-dock` in
# `dsh.profile.bundles`, so the row references the package BY NAME and Node
# resolution finds the installed code.
#
# The entry points at the package's Host half; the client module scan resolves
# the nearest owning package.json (ours), reads `dsh.client`, and composes the
# `./client` export into the __DSH_BOOT__ graph.
- insert:
    - id: skill-dock
      name: dsh-plugin-changhai-skill-dock
      config: {}
